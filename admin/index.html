<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מקושרים — ניהול</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #F7F2E8;
      --surface: #FFFFFF;
      --surface-2: #F0E9D6;
      --border: rgba(155,114,38,0.18);
      --text: #4A3B2A;
      --text-dim: #8A7860;
      --accent: #C9974B;
      --accent-dim: #9B7226;
      --green: #4CAF50;
      --red: #E57373;
      --amber: #F5B840;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { direction: rtl; text-align: right; font-family: 'Heebo', sans-serif; background: var(--bg);
      background-image: linear-gradient(135deg, #FAF6EE 0%, #F0E6D0 100%);
      background-attachment: fixed;
      color: var(--text); font-size: 15px; line-height: 1.6; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-left: 1px solid var(--border); padding: 24px 0; flex-shrink: 0; box-shadow: 0 4px 20px rgba(184,128,28,0.05); }
    .brand { padding: 0 24px 24px; font-weight: 900; font-size: 22px; color: var(--accent-dim); }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; cursor: pointer; color: var(--text-dim); transition: all .15s; border: none; background: none; width: 100%; text-align: right; font-family: inherit; font-size: 15px; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: rgba(229,169,58,0.15); color: var(--accent-dim); border-right: 3px solid var(--accent); font-weight: 700; }
    .nav-item svg { width: 18px; height: 18px; }
    .main { flex: 1; padding: 32px; overflow-y: auto; }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(184,128,28,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 14px; text-align: right; border-bottom: 1px solid var(--border); }
    th { color: var(--text-dim); font-weight: 500; font-size: 13px; }
    td { font-size: 14px; }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(155,114,38,0.04); }

    /* file input - עיצוב מותאם */
    input[type="file"] {
      padding: 0;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--text-dim);
    }
    input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, var(--accent), var(--gold-light));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Heebo', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-left: 12px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 3px 10px rgba(155,114,38,0.2);
    }
    input[type="file"]::file-selector-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(155,114,38,0.35);
    }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--surface-2); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; transition: all .15s; }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #F5C560); color: white; font-weight: 700; box-shadow: 0 3px 12px rgba(229,169,58,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(229,169,58,0.45); }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: transparent; color: #C62828; padding: 6px; }
    .btn-danger:hover { background: rgba(229,115,115,.1); }
    .link { color: var(--accent-dim); cursor: pointer; text-decoration: none; font-weight: 500; }
    .link:hover { text-decoration: underline; }
    input, select, textarea { background: white; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; width: 100%; transition: border-color .15s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 13px; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge-green { background: rgba(76,175,80,.15); color: #2E7D32; }
    .badge-amber { background: rgba(245,184,64,.2); color: var(--accent-dim); }
    .badge-dim { background: var(--surface-2); color: var(--text-dim); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .hidden { display: none; }
    .modal-bg { position: fixed; inset: 0; background: rgba(58,42,26,.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 440px; max-width: 90vw; max-height: 88vh; overflow-y: auto; }
    .modal.wide { width: 640px; }
    .modal h3 { margin-bottom: 18px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input { width: auto; }
    .empty { text-align: center; color: var(--text-dim); padding: 40px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--surface-2); border-radius: 10px; padding: 14px; border: 1px solid var(--border); }
    .stat .num { font-size: 24px; font-weight: 700; }
    .stat .lbl { color: var(--text-dim); font-size: 13px; }
    .section-h { font-size: 16px; font-weight: 700; margin: 20px 0 12px; }
    .rec-controls { display: flex; gap: 10px; align-items: center; margin: 12px 0; }
    .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .filter-bar select { width: auto; min-width: 180px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">מקושרים</div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i> דשבורד</button>
        <button class="nav-item" data-page="benefits"><i data-lucide="gift"></i> הטבות</button>
        <button class="nav-item" data-page="contacts"><i data-lucide="users"></i> לקוחות</button>
        <button class="nav-item" data-page="report"><i data-lucide="bar-chart-3"></i> דוחות</button>
      </nav>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modalRoot"></div>
  <script>
    const API = '/admin';
    let ADMIN_KEY = localStorage.getItem('adminKey') || prompt('מפתח ניהול:');
    localStorage.setItem('adminKey', ADMIN_KEY);

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY, ...(opts.headers||{}) } });
      if (res.status === 401) { localStorage.removeItem('adminKey'); location.reload(); }
      return res.json();
    }
    async function apiUpload(path, formData) {
      const res = await fetch(API + path, { method: 'POST', headers: { 'x-admin-key': ADMIN_KEY }, body: formData });
      return res.json();
    }
    function apiDownload(path, filename) {
      fetch(API + path, { headers: { 'x-admin-key': ADMIN_KEY } })
        .then(r => r.blob()).then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
          URL.revokeObjectURL(url);
        });
    }

    const main = document.getElementById('main');
    const modalRoot = document.getElementById('modalRoot');
    const pages = {};

    document.getElementById('nav').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-item'); if (!btn) return;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      btn.classList.add('active'); pages[btn.dataset.page]();
    });

    function icon(name) { return `<i data-lucide="${name}"></i>`; }
    function refresh() { lucide.createIcons(); }
    function closeModal() { modalRoot.innerHTML = ''; }
    function fmtDate(s) { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'}); }

    // ═══════════ דשבורד ═══════════
    pages.dashboard = async () => {
      main.innerHTML = `<div class="page-title">${icon('layout-dashboard')} דשבורד</div>
        <div id="dashContent" class="empty">טוען...</div>`;
      refresh();
      const d = await api('/dashboard');

      const totalStockCoupon = d.benefits.filter(b=>b.type==='coupon').reduce((s,b)=>s+(b.total_stock||0), 0);

      main.innerHTML = `<div class="page-title">${icon('layout-dashboard')} דשבורד</div>

        <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:24px">
          <div class="stat" style="border-right:3px solid var(--accent)">
            <div class="num">${d.contactsCount.toLocaleString('he-IL')}</div>
            <div class="lbl">${icon('users')} לקוחות</div>
          </div>
          <div class="stat" style="border-right:3px solid #2E7D32">
            <div class="num">${d.totalOrders.toLocaleString('he-IL')}</div>
            <div class="lbl">${icon('check-circle')} הזמנות</div>
          </div>
          <div class="stat" style="border-right:3px solid var(--accent-dim)">
            <div class="num">${d.todayOrders}</div>
            <div class="lbl">${icon('trending-up')} היום</div>
          </div>
          <div class="stat" style="border-right:3px solid #B8801C">
            <div class="num">${d.activeBenefits}</div>
            <div class="lbl">${icon('gift')} הטבות פעילות</div>
          </div>
          ${totalCouponsBar(d)}
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px">
          <!-- הטבות -->
          <div class="card">
            <h3 style="margin-bottom:14px;font-size:15px;color:var(--text-dim);font-weight:600">התפלגות הזמנות לפי הטבה</h3>
            ${d.benefits.length ? d.benefits.map(b => renderBenefitBar(b, d)).join('') : '<div class="empty">אין הטבות</div>'}
          </div>

          <!-- בתי כנסת -->
          <div class="card">
            <h3 style="margin-bottom:14px;font-size:15px;color:var(--text-dim);font-weight:600">בתי כנסת פעילים</h3>
            ${d.topSynagogues.length ? d.topSynagogues.map(s => `
              <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="jumpToSynagogueFilter('${s.synagogue.replace(/'/g,'')}')">
                <span>${s.synagogue}</span>
                <b>${s.n}</b>
              </div>`).join('') : '<div class="empty">אין נתונים</div>'}
          </div>
        </div>

        <!-- הזמנות אחרונות -->
        <div class="card">
          <h3 style="margin-bottom:14px;font-size:15px;color:var(--text-dim);font-weight:600">${icon('clock')} הזמנות אחרונות</h3>
          ${d.recentOrders.length ? `<table>
            <thead><tr><th>הטבה</th><th>לקוח</th><th>בית כנסת</th><th>זמן</th></tr></thead>
            <tbody>${d.recentOrders.map(o => `<tr>
              <td>${o.benefit_name}</td>
              <td>${o.contact_name||o.phone}</td>
              <td>${o.synagogue||'—'}</td>
              <td style="color:var(--text-dim);font-size:13px">${fmtDate(o.created_at)}</td>
            </tr>`).join('')}</tbody>
          </table>` : '<div class="empty">אין הזמנות עדיין</div>'}
        </div>`;
      refresh();
    };

    function totalCouponsBar(d) {
      if (!d.totalCoupons) return '';
      const used = d.totalCoupons - d.freeCoupons;
      const pct = Math.round((used / d.totalCoupons) * 100);
      return `<div class="stat" style="border-right:3px solid #F5B840">
        <div class="num">${d.freeCoupons}/${d.totalCoupons}</div>
        <div class="lbl">${icon('ticket')} קופונים פנויים</div>
      </div>`;
    }

    function renderBenefitBar(b, d) {
      const max = b.total_stock || Math.max(b.taken, 1);
      const pct = b.total_stock ? Math.round((b.taken / b.total_stock) * 100) : 100;
      const isCoupon = b.type === 'coupon';
      return `<div style="margin-bottom:14px;cursor:pointer" onclick="benefitDashboard(${b.id})">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-weight:600">${b.name}${!b.active?' <span class="badge badge-dim" style="margin-right:6px">כבוי</span>':''}</span>
          <span style="color:var(--text-dim);font-size:13px">
            ${b.taken}${b.total_stock ? ' / '+b.total_stock : ''} 
            ${isCoupon ? `<span style="margin-right:6px">•</span> ${b.free_coupons} פנויים` : ''}
          </span>
        </div>
        <div style="height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden">
          <div style="height:100%;background:linear-gradient(90deg,var(--accent),var(--gold-light));width:${pct}%;transition:width .5s"></div>
        </div>
      </div>`;
    }

    // ניווט לדוח עם סינון בית כנסת מוקדם
    window.jumpToSynagogueFilter = async (syn) => {
      // נכנס לדף דוחות ואז לפילטר
      window._syn_prefilter = syn;
      document.querySelector('[data-page="report"]').click();
    };

    pages.benefits = async () => {
      main.innerHTML = `<div class="page-title">${icon('gift')} הטבות</div>
        <div class="toolbar"><span></span>
          <button class="btn btn-primary" onclick="benefitModal()">${icon('plus')} הטבה חדשה</button></div>
        <div class="card"><div id="benefitsList" class="empty">טוען...</div></div>`;
      refresh();
      const list = await api('/benefits');
      const el = document.getElementById('benefitsList');
      if (!list.length) { el.className = 'empty'; el.textContent = 'אין הטבות עדיין'; return; }
      el.className = '';
      el.innerHTML = `<table><thead><tr>
        <th>שם</th><th>סוג</th><th>מלאי</th><th>נבחר</th><th>קופונים פנויים</th><th>למשפחה</th><th>צבירה</th><th>סטטוס</th><th>הקלטה</th><th></th>
        </tr></thead><tbody>${list.map(b => `<tr class="clickable" onclick="benefitDashboard(${b.id})">
          <td><b>${b.name}</b></td>
          <td>${b.type === 'coupon' ? 'קופון' : 'הרשמה'}</td>
          <td>${b.total_stock === 0 ? '∞' : b.total_stock}</td>
          <td>${b.taken}</td>
          <td>${b.type === 'coupon' ? b.coupons_free : '—'}</td>
          <td>${b.per_family}</td>
          <td>${b.stackable ? 'כן' : 'לא'}</td>
          <td><span class="badge ${b.active ? 'badge-green' : 'badge-dim'}">${b.active ? 'פעיל' : 'כבוי'}</span></td>
          <td>${b.recording ? icon('check') : icon('x')}</td>
          <td onclick="event.stopPropagation()" style="display:flex;gap:4px">
            ${b.type === 'coupon' ? `<button class="btn btn-ghost" style="padding:6px" onclick="couponsModal(${b.id},'${b.name.replace(/'/g,"")}')" title="קופונים">${icon('ticket')}</button>` : ''}
            <button class="btn btn-ghost" style="padding:6px" onclick="recordingModal(${b.id})" title="הקלטה">${icon('mic')}</button>
            <button class="btn btn-ghost" style="padding:6px" onclick="editBenefit(${b.id})" title="עריכה">${icon('pencil')}</button>
            <button class="btn btn-danger" onclick="delBenefit(${b.id})" title="מחיקה">${icon('trash-2')}</button>
          </td></tr>`).join('')}</tbody></table>`;
      refresh();
    };

    // מיני-דשבורד להטבה
    window.benefitDashboard = async (id) => {
      const [benefits, registrations] = await Promise.all([
        api('/benefits'),
        api('/benefits/'+id+'/registrations')
      ]);
      const b = benefits.find(x => String(x.id) === String(id));
      if (!b) return;

      // סטטיסטיקות
      const totalReg = registrations.length;
      const withCoupon = registrations.filter(r => r.coupon).length;
      const uniqueSynagogues = new Set(registrations.map(r => r.synagogue).filter(Boolean));
      const bySynagogue = {};
      registrations.forEach(r => {
        const s = r.synagogue || 'ללא בית כנסת';
        bySynagogue[s] = (bySynagogue[s] || 0) + 1;
      });
      const synagogueList = Object.entries(bySynagogue).sort((a,b) => b[1] - a[1]);
      const stockLeft = b.total_stock === 0 ? '∞' : (b.total_stock - totalReg);

      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal wide" style="width:720px">
          <h3 style="display:flex;align-items:center;gap:10px;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:10px">${icon('gift')} ${b.name}</span>
            <span class="badge ${b.active?'badge-green':'badge-dim'}">${b.active?'פעיל':'כבוי'}</span>
          </h3>

          <div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
            <div class="stat">
              <div class="num">${totalReg}</div>
              <div class="lbl">סה"כ הזמנות</div>
            </div>
            <div class="stat">
              <div class="num">${stockLeft}</div>
              <div class="lbl">נותרו במלאי</div>
            </div>
            <div class="stat">
              <div class="num">${b.per_family}</div>
              <div class="lbl">מגבלה למשפחה</div>
            </div>
            <div class="stat">
              <div class="num">${uniqueSynagogues.size}</div>
              <div class="lbl">בתי כנסת</div>
            </div>
          </div>

          ${b.type === 'coupon' ? `
          <div class="stat-grid" style="grid-template-columns:repeat(2,1fr)">
            <div class="stat">
              <div class="num" style="color:var(--accent-dim)">${b.coupons_free}</div>
              <div class="lbl">קופונים פנויים</div>
            </div>
            <div class="stat">
              <div class="num" style="color:#2E7D32">${withCoupon}</div>
              <div class="lbl">קופונים שהוקצו</div>
            </div>
          </div>` : ''}

          ${synagogueList.length ? `
          <div class="section-h">התפלגות לפי בית כנסת</div>
          <div style="max-height:180px;overflow-y:auto">
            <table><thead><tr><th>בית כנסת</th><th style="text-align:left">כמות</th></tr></thead>
              <tbody>${synagogueList.map(([s, n]) => `<tr>
                <td>${s}</td>
                <td style="text-align:left"><b>${n}</b></td></tr>`).join('')}
              </tbody></table>
          </div>` : ''}

          <div class="section-h">מי הזמין (${totalReg})</div>
          <div style="max-height:280px;overflow-y:auto">
            ${totalReg ? `<table><thead><tr><th>שם</th><th>טלפון</th><th>בית כנסת</th>${b.type==='coupon'?'<th>קופון</th>':''}<th>תאריך</th></tr></thead>
              <tbody>${registrations.map(r => `<tr>
                <td>${r.contact_id ? `<span class="link" onclick="closeModal();cardModal(${r.contact_id})">${r.name||'—'}</span>` : (r.name||'—')}</td>
                <td>${r.phone||'—'}</td>
                <td>${r.synagogue||'—'}</td>
                ${b.type==='coupon' ? `<td>${r.coupon?`<b>${r.coupon}</b>`:'—'}</td>` : ''}
                <td>${fmtDate(r.created_at)}</td></tr>`).join('')}
              </tbody></table>` : '<div class="empty">אין הזמנות עדיין</div>'}
          </div>

          <div class="row" style="margin-top:20px;gap:8px">
            <button class="btn btn-ghost" onclick="closeModal()">סגירה</button>
            <button class="btn btn-ghost" onclick="closeModal();editBenefit(${b.id})">${icon('pencil')} עריכה</button>
            ${b.type==='coupon'?`<button class="btn btn-ghost" onclick="closeModal();couponsModal(${b.id},'${b.name.replace(/'/g,'')}')">${icon('ticket')} ניהול קופונים</button>`:''}
          </div>
        </div></div>`;
      refresh();
    };

    // טוען הטבה מחדש מהשרת (מונע בעיות אסקייפ)
    window.editBenefit = async (id) => {
      const list = await api('/benefits');
      const b = list.find(x => String(x.id) === String(id));
      if (b) benefitModal(b);
    };

    window.benefitModal = (b = {}) => {
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">

            <option value="coupon" ${b.type==='coupon'?'selected':''}>קופון</option>
          </select></div>
          <div class="row">
            <div class="field"><label>מלאי כללי (0=ללא הגבלה)</label><input id="bStock" type="number" value="${b.total_stock??0}"></div>
            <div class="field"><label>מגבלה למשפחה</label><input id="bFamily" type="number" value="${b.per_family??1}"></div>

            <div class="field"><label>מזהה קבוצה (ריק = עומד לבד)</label><input id="bGroup" type="number" value="${b.group_id??''}" placeholder="למשל 1 או 2"></div>

              <option value="false" ${!b.stackable?'selected':''}>לא</option>
              <option value="true" ${b.stackable?'selected':''}>כן</option>
            </select></div>
          </div>
          <div class="field checkbox-row"><input type="checkbox" id="bActive" ${(b.active??true)?'checked':''}><label style="margin:0">פעיל</label></div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
            <button class="btn btn-primary" onclick="saveBenefit(${b.id||0})">שמירה</button>
          </div>
        </div></div>`;
      refresh();
    };
    window.saveBenefit = async (id) => {
      const body = { name: bName.value, type: bType.value, total_stock: +bStock.value, per_family: +bFamily.value, stackable: bStack.value === 'true', active: bActive.checked, sort_order: +bSort.value, group_id: document.getElementById('bGroup').value ? +document.getElementById('bGroup').value : null };
      if (id) await api('/benefits/'+id, { method:'PUT', body: JSON.stringify(body) });

      closeModal(); pages.benefits();

    // ── הקלטה: העלאה + הקלטה ישירה ──
    let mediaRecorder = null, recChunks = [], recBlob = null;
    window.recordingModal = (id) => {
      recBlob = null;
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal"><h3>הקלטת שם ההטבה</h3>
          <p style="color:var(--text-dim);font-size:13px;margin-bottom:14px">העלה קובץ או הקלט ישירות. הקובץ יומר אוטומטית ויעלה לימות.</p>
          <div class="section-h">העלאת קובץ</div>
          <div class="field"><input id="recFile" type="file" accept="audio/*" onchange="recBlob=this.files[0]"></div>
          <div class="section-h">או הקלטה ישירה</div>
          <div class="rec-controls">
            <button class="btn btn-ghost" id="recStart" onclick="startRec()">${icon('mic')} התחל הקלטה</button>
            <button class="btn btn-danger hidden" id="recStop" onclick="stopRec()" style="padding:9px 16px">${icon('square')} עצור</button>
            <span id="recIndicator"></span>
          </div>
          <audio id="recPlayback" controls class="hidden" style="width:100%;margin-top:10px"></audio>
          <div id="recStatus" style="margin-top:10px"></div>
          <div class="row" style="margin-top:14px">
            <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
            <button class="btn btn-primary" onclick="uploadRec(${id})">${icon('upload')} העלאה</button>
          </div>
        </div></div>`;
      refresh();
    };
    window.startRec = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream); recChunks = [];
        mediaRecorder.ondataavailable = e => recChunks.push(e.data);
        mediaRecorder.onstop = () => {
          recBlob = new Blob(recChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(recBlob);
          const pb = document.getElementById('recPlayback'); pb.src = url; pb.classList.remove('hidden');
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        document.getElementById('recStart').classList.add('hidden');
        document.getElementById('recStop').classList.remove('hidden');
        document.getElementById('recIndicator').innerHTML = '<span class="rec-dot"></span>';
      } catch (err) { document.getElementById('recStatus').innerHTML = `<p style="color:var(--red)">אין גישה למיקרופון: ${err.message}</p>`; }
    };
    window.stopRec = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.getElementById('recStart').classList.remove('hidden');
      document.getElementById('recStop').classList.add('hidden');
      document.getElementById('recIndicator').innerHTML = '';
    };
    window.uploadRec = async (id) => {
      if (!recBlob) { document.getElementById('recStatus').innerHTML = '<p style="color:var(--amber)">בחר קובץ או הקלט קודם</p>'; return; }
      document.getElementById('recStatus').innerHTML = '<p style="color:var(--amber)">מעלה...</p>';
      const fd = new FormData();
      const ext = recBlob.name ? recBlob.name.split('.').pop() : 'webm';
      fd.append('file', recBlob, `recording.${ext}`);
      const r = await apiUpload('/benefits/'+id+'/recording', fd);
      if (r.ok) { document.getElementById('recStatus').innerHTML = '<p style="color:var(--green)">הועלה בהצלחה</p>'; setTimeout(()=>{closeModal();pages.benefits();},900); }
      else document.getElementById('recStatus').innerHTML = `<p style="color:var(--red)">שגיאה: ${r.error}</p>`;
    };

    // ── קופונים ──

      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal wide"><h3>קופונים — ${name}</h3>
          <div class="stat-grid">
            <div class="stat"><div class="num">${coupons.length}</div><div class="lbl">סה"כ</div></div>
            <div class="stat"><div class="num">${free}</div><div class="lbl">פנויים</div></div>
            <div class="stat"><div class="num">${coupons.length-free}</div><div class="lbl">הוקצו</div></div>
          </div>
          <div class="field"><label>הוספת קופונים (קוד בכל שורה)</label>
            <textarea id="couponCodes" rows="4"></textarea></div>
          <button class="btn btn-primary" onclick="addCoupons(${id},'${name.replace(/'/g,"")}')">${icon('plus')} הוספה</button>
          <div class="section-h">רשימת קופונים</div>
          <div style="max-height:260px;overflow-y:auto"><table><thead><tr><th>קוד</th><th>סטטוס</th><th>הוקצה ל</th><th></th></tr></thead>
            <tbody>${coupons.map(c=>`<tr><td>${c.code}</td>
              <td><span class="badge ${c.phone?'badge-amber':'badge-green'}">${c.phone?'הוקצה':'פנוי'}</span></td>
              <td>${c.phone||'—'}</td>
              <td><button class="btn btn-danger" onclick="delCoupon(${c.id},${id},'${name.replace(/'/g,"")}')">${icon('trash-2')}</button></td></tr>`).join('')}</tbody></table></div>
          <div class="row" style="margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">סגירה</button></div>
        </div></div>`;
      refresh();
    };
    window.addCoupons = async (id, name) => {
      const codes = couponCodes.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if (!codes.length) return;
      await api('/benefits/'+id+'/coupons', { method:'POST', body: JSON.stringify({ codes }) });
      couponsModal(id, name);

    window.delCoupon = async (cid, bid, name) => { await api('/coupons/'+cid, {method:'DELETE'}); couponsModal(bid, name); };
    // ═══════════ לקוחות ═══════════
    let selectedContacts = new Set();

    pages.contacts = async () => {
      selectedContacts.clear();
      main.innerHTML = `<div class="page-title">${icon('users')} לקוחות מורשים</div>
        <div class="toolbar">
          <div style="display:flex;gap:10px;align-items:center;flex:1">
            <div style="position:relative;max-width:340px;flex:1">
              <input id="contactSearch" placeholder="חיפוש שם, טלפון, בית כנסת..." style="padding-right:38px" oninput="filterContacts(this.value)">
              <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;display:flex">${icon('search')}</span>
            </div>
            <button class="btn btn-danger hidden" id="btnDeleteSelected" onclick="deleteSelected()">${icon('trash-2')} מחק נבחרים (<span id="selectedCount">0</span>)</button>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" onclick="exportCSV()">${icon('download')} ייצוא CSV</button>
            <button class="btn btn-ghost" onclick="apiDownload('/contacts/template','contacts_template.xlsx')">${icon('file-down')} תבנית אקסל</button>
            <button class="btn btn-ghost" onclick="importModal()">${icon('file-up')} ייבוא קובץ</button>
            <button class="btn btn-primary" onclick="contactModal()">${icon('plus')} לקוח חדש</button>
          </div>
        </div>
        <div class="card"><div id="contactsList" class="empty">טוען...</div></div>`;
      refresh();
      await loadContacts();
    };

    window.filterContacts = (term) => {
      const t = term.trim().toLowerCase();
      const list = window._contactsList || [];
      const filtered = !t ? list : list.filter(c =>
        (c.phone||'').toLowerCase().includes(t) ||
        (c.phone2||'').toLowerCase().includes(t) ||
        (c.phone3||'').toLowerCase().includes(t) ||
        (c.name||'').toLowerCase().includes(t) ||
        (c.synagogue||'').toLowerCase().includes(t)
      );
      renderContactsTable(filtered);
    };

    function renderContactsTable(list) {
      const el = document.getElementById('contactsList');
      if (!list.length) { el.className='empty'; el.textContent='לא נמצאו לקוחות'; return; }
      el.className='';
      el.innerHTML = `<table><thead><tr>
        <th><input type="checkbox" id="chkAll" onchange="toggleAll(this)"></th>
        <th>טלפון</th><th>שם</th><th>בית כנסת</th><th></th>
        </tr></thead>
        <tbody>${list.map(c=>`<tr>
          <td onclick="event.stopPropagation()"><input type="checkbox" class="chk-contact" data-id="${c.id}" onchange="toggleContact(${c.id},this)"></td>
          <td class="clickable" onclick="cardModal(${c.id})">${c.phone}</td>
          <td class="clickable" onclick="cardModal(${c.id})">${c.name||'—'}</td>
          <td class="clickable" onclick="cardModal(${c.id})">${c.synagogue||'—'}</td>
          <td onclick="event.stopPropagation()" style="display:flex;gap:4px">
            <button class="btn btn-ghost" style="padding:6px" onclick="editContact(${c.id},'${(c.phone||'').replace(/'/g,'')}','${(c.phone2||'').replace(/'/g,'')}','${(c.phone3||'').replace(/'/g,'')}','${(c.name||'').replace(/'/g,'')}','${(c.synagogue||'').replace(/'/g,'')}')" title="עריכה">${icon('pencil')}</button>
            <button class="btn btn-danger" onclick="delContact(${c.id})" title="מחיקה">${icon('trash-2')}</button>
          </td></tr>`).join('')}
        </tbody></table>`;
      refresh();
    }

    async function loadContacts() {
      const list = await api('/contacts');
      window._contactsList = list;
      renderContactsTable(list);
    }

    window.toggleAll = (chk) => {
      document.querySelectorAll('.chk-contact').forEach(c => {
        c.checked = chk.checked;
        const id = parseInt(c.dataset.id);
        if (chk.checked) selectedContacts.add(id);
        else selectedContacts.delete(id);
      });
      updateSelectionUI();
    };
    window.toggleContact = (id, chk) => {
      if (chk.checked) selectedContacts.add(id);
      else selectedContacts.delete(id);
      updateSelectionUI();
    };
    function updateSelectionUI() {
      const btn = document.getElementById('btnDeleteSelected');
      const cnt = document.getElementById('selectedCount');
      if (selectedContacts.size > 0) { btn.classList.remove('hidden'); cnt.textContent = selectedContacts.size; }
      else btn.classList.add('hidden');
    }
    window.deleteSelected = async () => {
      if (!confirm(`למחוק ${selectedContacts.size} לקוחות?`)) return;
      for (const id of selectedContacts) {
        await api('/contacts/'+id, {method:'DELETE'});
      }
      selectedContacts.clear();
      await loadContacts();
    };

    window.exportCSV = () => {
      const list = window._contactsList || [];
      const rows = [
        ['טלפון', 'טלפון נוסף', 'טלפון נוסף 2', 'שם', 'בית כנסת'],
        ...list.map(c => [c.phone, c.phone2||'', c.phone3||'', c.name||'', c.synagogue||''])
      ];
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'contacts.csv'; a.click();
    };

    window.editContact = (id, phone, phone2, phone3, name, synagogue) => {
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal"><h3>עריכת לקוח</h3>
          <div class="field"><label>טלפון ראשי</label><input id="cPhone" value="${phone}"></div>
          <div class="field"><label>טלפון נוסף</label><input id="cPhone2" value="${phone2}"></div>
          <div class="field"><label>טלפון נוסף 2</label><input id="cPhone3" value="${phone3}"></div>
          <div class="field"><label>שם</label><input id="cName" value="${name}"></div>
          <div class="field"><label>בית כנסת</label><input id="cSyn" value="${synagogue}"></div>

          </div>
        </div></div>`;
      refresh();
    };
    window.updateContact = async (id) => {
      await api('/contacts/'+id, { method:'PUT', body: JSON.stringify({
        phone: cPhone.value,
        phone2: document.getElementById('cPhone2').value || null,
        phone3: document.getElementById('cPhone3').value || null,
        name: cName.value,
        synagogue: cSyn.value
      }) });
      closeModal(); await loadContacts();
    };
    window.contactModal = () => {
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal"><h3>לקוח חדש</h3>
          <div class="field"><label>טלפון ראשי</label><input id="cPhone"></div>
          <div class="field"><label>טלפון נוסף (אופציונלי)</label><input id="cPhone2"></div>
          <div class="field"><label>טלפון נוסף 2 (אופציונלי)</label><input id="cPhone3"></div>
          <div class="field"><label>שם</label><input id="cName"></div>
          <div class="field"><label>בית כנסת (אופציונלי)</label><input id="cSyn"></div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
            <button class="btn btn-primary" onclick="saveContact()">שמירה</button></div>
        </div></div>`;
      refresh();
    };
    window.saveContact = async () => {
      const p2 = document.getElementById('cPhone2')?.value||'';
      const p3 = document.getElementById('cPhone3')?.value||'';
      await api('/contacts', { method:'POST', body: JSON.stringify({ phone:cPhone.value, phone2:p2||null, phone3:p3||null, name:cName.value, synagogue:cSyn.value }) });
      closeModal(); await loadContacts();
    };
    window.delContact = async (id) => { if(confirm('למחוק?')){ await api('/contacts/'+id,{method:'DELETE'}); pages.contacts(); }};

    window.importModal = () => {
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal"><h3>ייבוא לקוחות מאקסל</h3>
          <p style="color:var(--text-dim);font-size:13px;margin-bottom:12px">קובץ אקסל עם עמודות: טלפון, טלפון נוסף, טלפון נוסף 2, שם, בית כנסת. הורד תבנית לדוגמה מהכפתור בעמוד הראשי.</p>
          <div class="field"><input id="importFile" type="file" accept=".xlsx,.xls,.csv"></div>
          <div id="importStatus"></div>
          <div id="importProgress" style="display:none;margin-top:12px">
            <div style="height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden">
              <div id="progressBar" style="height:100%;background:linear-gradient(90deg,var(--accent),var(--gold-light));width:0%;transition:width .3s"></div>
            </div>
            <div id="progressText" style="text-align:center;margin-top:8px;color:var(--text-dim);font-size:13px">מעלה קובץ...</div>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
            <button class="btn btn-primary" onclick="doImport()" id="importBtn">${icon('upload')} ייבוא</button></div>
        </div></div>`;
      refresh();
    };
    window.doImport = async () => {
      const f = document.getElementById('importFile').files[0];
      if (!f) return;

      const btn = document.getElementById('importBtn');
      btn.disabled = true;
      document.getElementById('importStatus').innerHTML = '';
      document.getElementById('importProgress').style.display = 'block';

      const bar = document.getElementById('progressBar');
      const text = document.getElementById('progressText');

      // הדמיית התקדמות: העלאה → עיבוד → סיום
      let progress = 0;
      const interval = setInterval(() => {
        if (progress < 90) {
          progress += Math.random() * 8;
          bar.style.width = Math.min(progress, 90) + '%';
          text.textContent = progress < 30 ? 'מעלה קובץ...' :
                             progress < 60 ? 'מעבד נתונים...' :
                             'שומר במסד הנתונים...';
        }
      }, 200);

      const fd = new FormData(); fd.append('file', f);

      try {
        const r = await apiUpload('/contacts/import', fd);
        clearInterval(interval);
        bar.style.width = '100%';

        if (r.inserted !== undefined) {
          text.textContent = 'הושלם!';
          let msg = `<p style="color:var(--green)">✓ יובאו ${r.inserted} לקוחות</p>`;
          if (r.skipped) msg += `<p style="color:var(--text-dim);font-size:13px;margin-top:6px">${r.skipped} שורות דולגו (חסר טלפון)</p>`;
          document.getElementById('importStatus').innerHTML = msg;
          setTimeout(()=>{closeModal();pages.contacts();}, 1500);
        } else {
          text.textContent = 'שגיאה';
          bar.style.background = 'var(--red)';
          document.getElementById('importStatus').innerHTML = `<p style="color:var(--red)">שגיאה: ${r.error}</p>`;
          btn.disabled = false;
        }
      } catch (e) {
        clearInterval(interval);
        text.textContent = 'שגיאה';
        document.getElementById('importStatus').innerHTML = `<p style="color:var(--red)">שגיאה בהעלאה</p>`;
        btn.disabled = false;
      }
    };

    // ── כרטסת לקוח ──
    window.cardModal = async (id) => {

      const c = data.contact;
      const benefits = await api('/benefits');
      modalRoot.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">

            <div class="stat"><div class="num" style="font-size:18px">${c.phone}</div><div class="lbl">טלפון</div></div>
            <div class="stat"><div class="num" style="font-size:18px">${c.synagogue||'—'}</div><div class="lbl">בית כנסת</div></div>
          </div>
          <div class="section-h">הזמנות (${data.selections.length})</div>

            <tbody>${data.selections.length ? data.selections.map(s=>`<tr>
              <td>${s.benefit_name}</td><td>${s.type==='coupon'?'קופון':'הרשמה'}</td>
              <td>1</td>
              <td>${s.recording_path ? `<button class="btn btn-ghost" style="padding:6px" onclick="playRec('${s.recording_path}')" title="השמע הקלטה">${icon('play')}</button>` : '—'}</td>
              <td>${fmtDate(s.created_at)}</td>
              <td><button class="btn btn-danger" onclick="delSelection(${s.id},${id})" title="ביטול">${icon('trash-2')}</button></td></tr>`).join('')
              : '<tr><td colspan="6" style="color:var(--text-dim)">אין הזמנות</td></tr>'}</tbody></table>
          <audio id="recAudio" controls style="width:100%;margin-top:12px;display:none"></audio>
          ${data.coupons.length ? `<div class="section-h">קופונים</div>
            <table><thead><tr><th>הטבה</th><th>קוד</th><th>תאריך</th></tr></thead>
            <tbody>${data.coupons.map(cp=>`<tr><td>${cp.benefit_name}</td><td><b>${cp.code}</b></td><td>${fmtDate(cp.assigned_at)}</td></tr>`).join('')}</tbody></table>` : ''}
          <div class="section-h">הוספת הזמנה ידנית</div>
          <div class="row" style="align-items:end">
            <div class="field" style="margin:0"><label>בחר הטבה</label><select id="manualBenefit">
              ${benefits.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
            <button class="btn btn-primary" style="flex:0" onclick="addManualSelection(${id})">${icon('plus')} הוסף</button>
          </div>
          <div class="row" style="margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">סגירה</button></div>
        </div></div>`;
      refresh();
    };
    window.delSelection = async (sid, cid) => { if(confirm('לבטל את ההזמנה? קופון משויך יוחזר למלאי.')){ await api('/selections/'+sid,{method:'DELETE'}); cardModal(cid); }};
    window.playRec = (path) => {
      const audio = document.getElementById('recAudio');
      audio.src = `${API}/recording?path=${encodeURIComponent(path)}`;
      audio.style.display = 'block';
      audio.play();
    };
    window.addManualSelection = async (cid) => {
      const bid = document.getElementById('manualBenefit').value;
      await api('/contacts/'+cid+'/selection', { method:'POST', body: JSON.stringify({ benefit_id: +bid }) });
      cardModal(cid);
    };
    // ═══════════ דוחות ═══════════
    pages.report = async () => {
      main.innerHTML = `<div class="page-title">${icon('bar-chart-3')} דוחות</div><div class="card"><div id="reportList" class="empty">טוען...</div></div>`;
      refresh();
      const list = await api('/report');
      const el = document.getElementById('reportList');
      el.className='';
      el.innerHTML = `<table><thead><tr><th>הטבה</th><th>סוג</th><th>מלאי</th><th>נבחרו</th><th>נותרו</th><th></th></tr></thead>
        <tbody>${list.map(r=>`<tr class="clickable" onclick="benefitReport(${r.id},'${r.name.replace(/'/g,"")}')"><td>${r.name}</td><td>${r.type==='coupon'?'קופון':'הרשמה'}</td>
        <td>${r.total_stock===0?'∞':r.total_stock}</td><td>${r.selections}</td>
        <td>${r.total_stock===0?'∞':(r.total_stock-r.selections)}</td>
        <td>${icon('chevron-left')}</td></tr>`).join('')}</tbody></table>`;
      refresh();
    };

    // ── דוח מפורט של הטבה: מי הזמין + פילטר בית כנסת ──
    let currentReg = [], currentBenefitName = '';
    window.benefitReport = async (id, name) => {
      currentBenefitName = name;
      currentReg = await api('/benefits/'+id+'/registrations');
      const synagogues = [...new Set(currentReg.map(r=>r.synagogue).filter(Boolean))].sort();
      main.innerHTML = `<div class="page-title">
          <span class="link" onclick="pages.report()">דוחות</span> ${icon('chevron-left')} ${name}</div>
        <div class="filter-bar" style="gap:16px;flex-wrap:wrap">
          <div style="position:relative;flex:1;max-width:340px">
            <input id="regSearch" placeholder="חיפוש שם, טלפון, בית כנסת..." style="padding-right:38px" oninput="renderReg()">
            <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;display:flex">${icon('search')}</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <label style="color:var(--text-dim);white-space:nowrap">${icon('filter')} בית כנסת:</label>
            <select id="synFilter" onchange="renderReg()" style="width:auto;min-width:160px">
              <option value="">הכל</option>
              ${synagogues.map(s=>`<option value="${s}">${s}</option>`).join('')}
            </select>
          </div>
          <span id="regCount" style="color:var(--text-dim);margin-right:auto"></span>
          <button class="btn btn-ghost" onclick="exportRegCSV()">${icon('download')} ייצוא CSV</button>
        </div>
        <div class="card"><div id="regList"></div></div>`;
      refresh();
      renderReg();
    };

    window.exportRegCSV = () => {
      const filter = document.getElementById('synFilter').value;
      const term = (document.getElementById('regSearch')?.value||'').trim().toLowerCase();
      let rows = filter ? currentReg.filter(r=>r.synagogue===filter) : currentReg;
      if (term) rows = rows.filter(r =>
        (r.phone||'').toLowerCase().includes(term) ||
        (r.name||'').toLowerCase().includes(term) ||
        (r.synagogue||'').toLowerCase().includes(term)
      );
      const data = [
        ['שם','טלפון','בית כנסת','קופון','תאריך'],
        ...rows.map(r => [r.name||'', r.phone||'', r.synagogue||'', r.coupon||'', fmtDate(r.created_at)])
      ];
      const csv = data.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `דוח_${currentBenefitName}.csv`;
      a.click();
    };
    window.renderReg = () => {
      const filter = document.getElementById('synFilter').value;
      const term = (document.getElementById('regSearch')?.value||'').trim().toLowerCase();
      let rows = filter ? currentReg.filter(r=>r.synagogue===filter) : currentReg;
      if (term) rows = rows.filter(r =>
        (r.phone||'').toLowerCase().includes(term) ||
        (r.name||'').toLowerCase().includes(term) ||
        (r.synagogue||'').toLowerCase().includes(term)
      );
      document.getElementById('regCount').textContent = `${rows.length} רשומים`;
      const el = document.getElementById('regList');
      if (!rows.length) { el.className='empty'; el.textContent='אין רשומים'; refresh(); return; }
      el.className='';
      el.innerHTML = `<table><thead><tr><th>שם</th><th>טלפון</th><th>בית כנסת</th><th>קופון</th><th>תאריך</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${r.contact_id ? `<span class="link" onclick="cardModal(${r.contact_id})">${r.name||'—'}</span>` : (r.name||'—')}</td>
          <td>${r.phone||'—'}</td><td>${r.synagogue||'—'}</td>
          <td>${r.coupon?`<b>${r.coupon}</b>`:'—'}</td><td>${fmtDate(r.created_at)}</td></tr>`).join('')}</tbody></table>`;
      refresh();
    };

    pages.dashboard();
  </script>
</body>
</html>
