<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מקושרים — הזמנת הטבות</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #FFF9EF;
      --surface: #FFFFFF;
      --surface-2: #FDF3DE;
      --border: rgba(184,128,28,0.15);
      --text: #3A2A1A;
      --text-dim: #7A6852;
      --accent: #E5A93A;
      --accent-dim: #B8801C;
      --gold-light: #F5C560;
      --green: #4CAF50;
      --red: #E57373;
      --amber: #F5B840;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { direction: rtl; text-align: right; font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 520px; margin: 0 auto; padding: 24px 16px; }
    .header { text-align: center; padding: 32px 0 24px; }
    .header h1 { font-size: 32px; font-weight: 900; color: var(--accent-dim); }
    .header p { color: var(--text-dim); margin-top: 6px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 24px rgba(184,128,28,0.08); }
    .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .card h2 svg { width: 20px; height: 20px; color: var(--accent); }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 13px; }
    input, select, textarea { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 8px; font-family: inherit; font-size: 15px; width: 100%; transition: border .15s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; transition: all .15s; width: 100%; }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--gold-light)); color: white; font-weight: 700; box-shadow: 0 4px 16px rgba(229,169,58,0.35); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(229,169,58,0.5); }
    .btn-primary:disabled { background: var(--surface-2); color: var(--text-dim); cursor: not-allowed; box-shadow: none; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(229,115,115,.15); color: #C62828; border: 1px solid rgba(229,115,115,.25); }
    .error { background: rgba(229,115,115,.1); border: 1px solid rgba(229,115,115,.3); border-radius: 8px; padding: 12px 14px; color: #C62828; font-size: 14px; margin-bottom: 14px; }
    .success { background: rgba(76,175,80,.12); border: 1px solid rgba(76,175,80,.3); border-radius: 8px; padding: 12px 14px; color: #2E7D32; font-size: 14px; margin-bottom: 14px; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge-green { background: rgba(76,175,80,.15); color: #2E7D32; }
    .badge-amber { background: rgba(245,184,64,.2); color: var(--accent-dim); }
    .benefit-item { background: var(--surface-2); border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; transition: all .2s; }
    .benefit-item:hover { border-color: var(--accent); background: #FFFFFF; box-shadow: 0 4px 12px rgba(229,169,58,0.15); }
    .benefit-item.selected { border-color: var(--accent); }
    .benefit-item.ordered { border-color: var(--green); opacity: .75; cursor: default; background: rgba(76,175,80,.08); }
    .benefit-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .benefit-meta { color: var(--text-dim); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
    .coupon-code { background: linear-gradient(135deg, #FFF3D6, #FFE4A6); border-radius: 12px; padding: 14px 16px; font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 3px; color: var(--accent-dim); margin: 8px 0; border: 2px dashed var(--accent); }
    .section-h { font-size: 15px; font-weight: 700; margin: 16px 0 10px; color: var(--text-dim); }
    .hidden { display: none; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-row input { width: 80px; text-align: center; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.png" alt="מקושרים" style="width:120px;height:auto;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(184,128,28,0.15));">
      <p style="color:var(--text-dim);font-size:15px;">הזמנת הטבות</p>
    </div>

    <!-- שלב 1: כניסה -->
    <div id="pageLogin" class="card">
      <h2><i data-lucide="phone"></i> כניסה</h2>
      <div class="field">
        <label>מספר טלפון</label>
        <input id="phoneInput" type="tel" placeholder="050-0000000" inputmode="numeric">
      </div>
      <div id="loginError"></div>
      <button class="btn btn-primary" onclick="doLogin()" id="loginBtn">
        <i data-lucide="log-in"></i> כניסה
      </button>
    </div>

    <!-- שלב 2: הזמנה -->
    <div id="pageOrder" class="hidden">
      <div class="card">
        <h2><i data-lucide="user"></i> <span id="welcomeName"></span></h2>
        <div id="myOrders"></div>
      </div>
      <div class="card" id="orderCard">
        <h2><i data-lucide="gift"></i> הטבות זמינות</h2>
        <div id="benefitsList"></div>

        <!-- פרטי הזמנה (מוצג אחרי בחירת הטבה) -->
        <div id="orderDetails" class="hidden">
          <hr class="divider">
          <div class="field">
            <label>מספרי תעודת זהות של הילדים</label>
            <textarea id="idNumbers" rows="3" placeholder="הכנס מספרי ת.ז. של הילדים המוזמנים..."></textarea>
          </div>
          <div class="field">
            <label>כמות (<span id="maxQty"></span> לכל היותר)</label>
            <div class="qty-row">
              <button class="btn btn-ghost" style="width:44px;padding:8px" onclick="changeQty(-1)">−</button>
              <input id="qtyInput" type="number" value="1" min="1" max="1">
              <button class="btn btn-ghost" style="width:44px;padding:8px" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div id="orderError"></div>
          <button class="btn btn-primary" onclick="doOrder()" id="orderBtn">
            <i data-lucide="check"></i> אישור הזמנה
          </button>
        </div>
      </div>

      <!-- אישור הזמנה -->
      <div id="pageSuccess" class="hidden">
        <div class="card">
          <div style="text-align:center;padding:20px 0">
            <i data-lucide="check-circle" style="width:48px;height:48px;color:var(--green)"></i>
            <h2 style="justify-content:center;margin-top:12px">ההזמנה אושרה</h2>
            <div id="successDetails" style="margin-top:12px;color:var(--text-dim)"></div>
          </div>
          <div id="couponCodes"></div>
          <button class="btn btn-ghost" style="margin-top:16px" onclick="showMyOrders()">
            <i data-lucide="list"></i> הזמנות שלי
          </button>
        </div>
      </div>

      <button class="btn btn-ghost" style="margin-top:8px" onclick="logout()">
        <i data-lucide="log-out"></i> התנתקות
      </button>
    </div>

    <div style="text-align:center;padding:32px 20px 24px;border-top:1px solid var(--border);margin-top:20px;color:var(--text-dim);font-size:13px;">
      <div style="margin-bottom:8px;font-weight:700;color:var(--accent-dim);">פותח על ידי MARK</div>
      <div>אוטומציות עסקיות חכמות</div>
      <div style="margin-top:10px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;">
        <a href="tel:0556738802" style="color:var(--text-dim);text-decoration:none;">📱 055-6738802</a>
        <a href="mailto:Z6738802@GMAIL.COM" style="color:var(--text-dim);text-decoration:none;">📧 Z6738802@GMAIL.COM</a>
      </div>
    </div>

  </div>

  <script>
    const API = '/api';
    let currentPhone = null;
    let currentUser = null;
    let selectedBenefit = null;
    let allBenefits = [];

    function icon(name, size=16) { return `<i data-lucide="${name}" style="width:${size}px;height:${size}px"></i>`; }
    function refresh() { lucide.createIcons(); }
    function fmtDate(s) { if (!s) return ''; return new Date(s).toLocaleDateString('he-IL'); }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) } });
      const data = await res.json();
      if (!res.ok) throw data;
      return data;
    }

    // ── כניסה ──
    document.getElementById('phoneInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

    async function doLogin() {
      const phone = document.getElementById('phoneInput').value.trim().replace(/[-\s]/g,'');
      if (!phone) return;
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<div class="spinner"></div>';
      btn.disabled = true;
      document.getElementById('loginError').innerHTML = '';
      try {
        const user = await api('/login', { method:'POST', body: JSON.stringify({ phone }) });
        currentPhone = phone;
        currentUser = user;
        document.getElementById('pageLogin').classList.add('hidden');
        document.getElementById('pageOrder').classList.remove('hidden');
        document.getElementById('welcomeName').textContent = user.name || phone;
        await loadPage();
      } catch(e) {
        document.getElementById('loginError').innerHTML = `<div class="error">המספר אינו ברשימת הלקוחות המורשים</div>`;
        btn.innerHTML = `${icon('log-in')} כניסה`;
        btn.disabled = false;
      }
      refresh();
    }

    async function loadPage() {
      const [benefits, myData] = await Promise.all([
        api('/benefits'),
        api(`/my/${currentPhone}`)
      ]);
      allBenefits = benefits;
      renderMyOrders(myData);
      renderBenefits(benefits, myData);
      refresh();
    }

    // ── ההזמנות שלי ──
    function renderMyOrders(myData) {
      const el = document.getElementById('myOrders');
      if (!myData.selections.length && !myData.coupons.length) {
        el.innerHTML = '<p style="color:var(--text-dim);font-size:14px">עדיין לא הזמנת הטבות</p>';
        return;
      }
      let html = '';
      if (myData.selections.length) {
        html += `<div class="section-h">ההזמנות שלי</div>`;
        // מקבץ לפי benefit_id (כי יכול להיות כמה שורות לאותה הטבה)
        const grouped = {};
        myData.selections.forEach(s => {
          if (!grouped[s.benefit_id]) grouped[s.benefit_id] = { ...s, count: 0 };
          grouped[s.benefit_id].count++;
        });
        Object.values(grouped).forEach(s => {
          html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-weight:600">${s.name}</div>
              <div style="color:var(--text-dim);font-size:13px">${s.count} יחידות | ${fmtDate(s.created_at)}</div>
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="changeOrder(${s.benefit_id})">שנה</button>
              <button class="btn btn-danger" style="width:auto;padding:6px 10px;font-size:13px" onclick="cancelOrder(${s.benefit_id})">בטל</button>
            </div>
          </div>`;
        });
      }
      if (myData.coupons.length) {
        html += `<div class="section-h">הקופונים שלי</div>`;
        myData.coupons.forEach(c => {
          html += `<div style="margin-bottom:8px">
            <div style="color:var(--text-dim);font-size:13px">${c.benefit_name}</div>
            <div class="coupon-code">${c.code}</div>
          </div>`;
        });
      }
      el.innerHTML = html;
    }

    // ── רשימת הטבות ──
    function renderBenefits(benefits, myData) {
      const orderedIds = new Set(myData.selections.map(s => s.benefit_id));
      const el = document.getElementById('benefitsList');
      if (!benefits.length) { el.innerHTML = '<p style="color:var(--text-dim)">אין הטבות זמינות כרגע</p>'; return; }
      el.innerHTML = benefits.map(b => {
        const isOrdered = orderedIds.has(b.id);
        return `<div class="benefit-item ${isOrdered?'ordered':''}" data-id="${b.id}" data-ordered="${isOrdered}">
          <div class="benefit-name">${b.name}</div>
          <div class="benefit-meta">
            <span>${b.type==='coupon'?'קופון':'הרשמה'}</span>
            <span>עד ${b.per_family} יחידות</span>
            ${b.total_stock>0?`<span>נשארו: ${b.total_stock}</span>`:''}
            ${isOrdered?'<span class="badge badge-green">הוזמן</span>':''}
          </div>
        </div>`;
      }).join('');

      // אירועי לחיצה דרך JS
      el.querySelectorAll('.benefit-item').forEach(item => {
        item.addEventListener('click', () => {
          if (item.dataset.ordered === 'true') return;
          selectBenefit(parseInt(item.dataset.id));
        });
      });
    }

    // ── בחירת הטבה ──
    function selectBenefit(id) {
      selectedBenefit = allBenefits.find(b => String(b.id) === String(id));
      if (!selectedBenefit) return;

      document.querySelectorAll('.benefit-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`.benefit-item[data-id="${id}"]`)?.classList.add('selected');

      document.getElementById('orderDetails').classList.remove('hidden');
      document.getElementById('pageSuccess').classList.add('hidden');
      document.getElementById('maxQty').textContent = selectedBenefit.per_family;
      document.getElementById('qtyInput').max = selectedBenefit.per_family;
      document.getElementById('qtyInput').value = 1;
      document.getElementById('orderError').innerHTML = '';
      document.getElementById('idNumbers').value = '';

      if (selectedBenefit.type === 'coupon') {
        document.getElementById('orderError').innerHTML = `<div class="error" style="background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:var(--amber)">
          ${icon('alert-triangle')} שים לב: הטבה זו מסוג קופון — יש לשמור את הקוד שתקבל
        </div>`;
      }
      refresh();
      document.getElementById('orderDetails').scrollIntoView({ behavior: 'smooth' });
    }

    // ── ביטול הזמנה ──
    async function cancelOrder(benefitId) {
      if (!confirm('לבטל את ההזמנה?')) return;
      try {
        await api(`/cancel/${currentPhone}/${benefitId}`);
        await loadPage();
      } catch(e) {
        alert('אירעה שגיאה בביטול');
      }
    }

    // ── שינוי הזמנה (מאפס ובוחר מחדש) ──
    async function changeOrder(benefitId) {
      try {
        await api(`/cancel/${currentPhone}/${benefitId}`);
        await loadPage();
        // גלול לתפריט הבחירה
        document.getElementById('benefitsList').scrollIntoView({ behavior: 'smooth' });
      } catch(e) {
        alert('אירעה שגיאה');
      }
    }

    function changeQty(delta) {
      const input = document.getElementById('qtyInput');
      const max = selectedBenefit ? selectedBenefit.per_family : 1;
      const val = Math.min(max, Math.max(1, (parseInt(input.value)||1) + delta));
      input.value = val;
    }

    // ── הזמנה ──
    async function doOrder() {
      if (!selectedBenefit) return;
      const idNumbers = document.getElementById('idNumbers').value.trim();
      const qty = parseInt(document.getElementById('qtyInput').value) || 1;

      if (!idNumbers) {
        document.getElementById('orderError').innerHTML = `<div class="error">יש להכניס מספרי תעודת זהות</div>`;
        return;
      }

      const btn = document.getElementById('orderBtn');
      btn.innerHTML = '<div class="spinner"></div>';
      btn.disabled = true;
      document.getElementById('orderError').innerHTML = '';

      try {
        const params = new URLSearchParams({ phone: currentPhone, benefit_id: selectedBenefit.id, qty, id_numbers: idNumbers });
        const result = await api(`/order?${params}`);

        // הצג אישור
        document.getElementById('orderDetails').classList.add('hidden');
        document.getElementById('pageSuccess').classList.remove('hidden');
        document.getElementById('successDetails').textContent = `${selectedBenefit.name} — ${qty} יחידות`;

        if (result.type === 'coupon' && result.codes) {
          document.getElementById('couponCodes').innerHTML = `
            <div class="section-h">הקופונים שלך</div>
            ${result.codes.map(c => `<div class="coupon-code">${c}</div>`).join('')}
            <p style="color:var(--amber);font-size:13px;margin-top:8px">שמור את הקוד — הוא לא יוצג שוב</p>
          `;
        }
        refresh();
        await loadPage();
      } catch(e) {
        const msgs = {
          already_ordered: `כבר הזמנת את ההטבה "${e.benefit_name}"`,
          has_other: `כבר הזמנת הטבה אחרת (${e.benefit_name}). ניתן לבחור הטבה אחת בלבד.`,
          out_of_stock: 'המלאי אזל',
          invalid_qty: `כמות לא חוקית (מקסימום ${e.max})`,
          not_authorized: 'לא מורשה',
        };
        document.getElementById('orderError').innerHTML = `<div class="error">${msgs[e.error] || 'אירעה שגיאה, נסה שוב'}</div>`;
        btn.innerHTML = `${icon('check')} אישור הזמנה`;
        btn.disabled = false;
        refresh();
      }
    }

    async function showMyOrders() {
      document.getElementById('pageSuccess').classList.add('hidden');
      await loadPage();
    }

    function logout() {
      currentPhone = null; currentUser = null; selectedBenefit = null;
      document.getElementById('pageLogin').classList.remove('hidden');
      document.getElementById('pageOrder').classList.add('hidden');
      document.getElementById('phoneInput').value = '';
      document.getElementById('loginBtn').innerHTML = `${icon('log-in')} כניסה`;
      document.getElementById('loginBtn').disabled = false;
      refresh();
    }

    refresh();
  </script>
</body>
</html>
